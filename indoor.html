<script>
    // Hàm lắng nghe mọi sự kiện truyền tin từ Dashboard E-Ra vào iFrame
    window.addEventListener('message', function(event) {
        // In log ra F12 để kiểm tra nếu cần
        console.log("Dữ liệu từ E-Ra ném vào:", event.data);
        
        const eraData = event.data;
        if (!eraData) return;

        // TRƯỜNG HỢP 1: E-Ra truyền dạng Object chuẩn của hệ thống
        if (typeof eraData === 'object') {
            // Kiểm tra các kiểu định dạng tên chân (V1/v1, V2/v2)
            if (eraData.pin === 'V1' && eraData.value !== undefined) updateTemp(eraData.value);
            if (eraData.pin === 'V2' && eraData.value !== undefined) updateHumi(eraData.value);
            
            if (eraData.V1 !== undefined) updateTemp(eraData.V1);
            if (eraData.V2 !== undefined) updateHumi(eraData.V2);
            if (eraData.v1 !== undefined) updateTemp(eraData.v1);
            if (eraData.v2 !== undefined) updateHumi(eraData.v2);
        }
        
        // TRƯỜNG HỢP 2: E-Ra truyền dạng chuỗi String đóng gói JSON (Phòng xa)
        if (typeof eraData === 'string') {
            try {
                const parsed = JSON.parse(eraData);
                if (parsed.pin === 'V1') updateTemp(parsed.value);
                if (parsed.pin === 'V2') updateHumi(parsed.value);
                if (parsed.V1 !== undefined) updateTemp(parsed.V1);
                if (parsed.V2 !== undefined) updateHumi(parsed.V2);
            } catch (e) {
                // Nếu là chuỗi thô không phải JSON, bỏ qua lỗi
            }
        }
    });

    // Hàm cập nhật và ép kiểu dữ liệu hiển thị Nhiệt độ
    function updateTemp(val) {
        const tempElement = document.getElementById('indoor-temp');
        if (tempElement && val !== null && val !== undefined) {
            let num = parseFloat(val);
            if (!isNaN(num)) {
                tempElement.innerHTML = num.toFixed(1) + "<span>°C</span>";
            }
        }
    }

    // Hàm cập nhật và ép kiểu dữ liệu hiển thị Độ ẩm
    function updateHumi(val) {
        const humiElement = document.getElementById('indoor-humi');
        if (humiElement && val !== null && val !== undefined) {
            let num = parseFloat(val);
            if (!isNaN(num)) {
                humiElement.innerHTML = num.toFixed(1) + "<span>%</span>";
            }
        }
    }
</script>
