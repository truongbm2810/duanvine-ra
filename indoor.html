<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test ERa Data Stream</title>
    <script src="https://unpkg.com/@eohjsc/era-widget@1.1.3/src/index.js"></script>
</head>
<body style="background-color: #ffffff; color: #000000; font-family: sans-serif; padding: 20px;">

    <h1>KẾT QUẢ KIỂM TRA ĐỒNG BỘ DỮ LIỆU</h1>
    <hr>
    
    <h3>1. Dữ liệu thô (Raw) từ hệ thống trả về:</h3>
    <pre id="raw-config" style="background: #eee; padding: 10px;">Đang tải cấu hình (onConfiguration)...</pre>
    <pre id="raw-values" style="background: #eee; padding: 10px;">Đang đợi dữ liệu truyền về (onValues)...</pre>

    <hr>

    <h3>2. Giá trị bóc tách hiển thị:</h3>
    <h2>Nhiệt độ: <span id="test-t" style="color: red;">--</span> °C</h2>
    <h2>Độ ẩm: <span id="test-h" style="color: blue;">--</span> %</h2>

    <script>
        const era = new EraWidget();

        era.init({
            onConfiguration: (c) => {
                // In toàn bộ cấu hình nhận được lên màn hình để kiểm tra xem IFrame đã thấy các chân chưa
                document.getElementById('raw-config').innerText = 
                    "Đã kết nối ERa! Danh sách Realtime Configs:\n" + JSON.stringify(c.realtime_configs, null, 2);
            },
            onValues: (v) => {
                // In toàn bộ cục giá trị Realtime đổ về liên tục
                document.getElementById('raw-values').innerText = 
                    "Dữ liệu thay đổi mới nhất:\n" + JSON.stringify(v, null, 2);

                // Thử bóc tách theo phương pháp Index dòng (Dòng 1 và Dòng 2 trong Widget cài đặt)
                if (era.config.realtime_configs[0] && v[era.config.realtime_configs[0].id]) {
                    document.getElementById('test-t').innerText = v[era.config.realtime_configs[0].id].value;
                }
                if (era.config.realtime_configs[1] && v[era.config.realtime_configs[1].id]) {
                    document.getElementById('test-h').innerText = v[era.config.realtime_configs[1].id].value;
                }
            }
        });
    </script>
</body>
</html>
